  <article class="post-content e-content with-title">
    <p>植物园中，各色的花儿总是被人簇拥，旁边的小草又有几人垂怜？</p>
<p>花儿或许厌烦，小草也未必介怀。人连自己、同类都无法理解，又怎能共情于花草？</p>
<p>然见此「差别对待」，心中难免多出些涟漪，或是自大？或是自怜？但总归是真实的自我。</p>
